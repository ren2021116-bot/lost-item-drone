<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a3a6b">
  <title>FINDRONE AI探偵カメラ</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
<div class="app-container">
  <h1>🔍 AI探偵カメラ</h1>

  <div class="tab-menu">
    <button class="tab-btn active" data-tab="search">🔍 探索モード</button>
    <button class="tab-btn" data-tab="register">📦 物体登録モード</button>
  </div>

  <!-- ================= 探索モード ================= -->
  <section id="searchTab" class="tab-content active">
    <div class="card">
      <label for="pcIdInput">🔗 PC接続用ID(任意)</label>
      <div class="row">
        <input id="pcIdInput" type="text" placeholder="PCの画面に出るID 例: FD-7K3M" autocomplete="off" autocapitalize="characters">
        <button id="connectButton" class="btn blue">接続</button>
      </div>
      <div class="note">PCの画面(pc.html)のQRコードをスマホのカメラで読み取ると、自動でつながります。</div>
      <div id="connectionStatus" class="note">未接続(つながなくても探索は使えます)</div>
    </div>

    <div class="card">
      <label for="targetObject">探すもの</label>
      <div class="row">
        <input id="targetObject" type="text" value="cup" placeholder="例: cup / コップ / 登録した名前">
        <button id="targetButton" class="btn blue">決定</button>
      </div>
      <div id="quickSelectList" class="chips"></div>
      <label for="placeInput">場所名(任意)</label>
      <input id="placeInput" type="text" placeholder="例: P1 / 1F廊下" autocomplete="off">
    </div>

    <div class="card">
      <label for="modelSelect">AIモデル切り替え(標準の80種類用)</label>
      <select id="modelSelect">
        <option value="lite0">EfficientDet-Lite0 (標準)</option>
        <option value="lite2">EfficientDet-Lite2 (高精度)</option>
      </select>
    </div>

    <div class="camera-container">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="outputCanvas"></canvas>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="startButton" class="btn green wide" disabled>AI準備中...</button>
      <button id="stopButton" class="btn red wide" hidden>停止</button>
    </div>
    <div id="status" class="status-box">ステータス: AIモデルをロード中...</div>

    <div class="row between">
      <h3>📁 発見したアイテムの履歴</h3>
      <button id="clearGalleryButton" class="btn red small">履歴クリア</button>
    </div>
    <div id="imageGallery" class="gallery"></div>
  </section>

  <!-- ================= 物体登録モード ================= -->
  <section id="registerTab" class="tab-content">
    <div class="card">
      <label for="registerName">登録するカスタム物体名</label>
      <input id="registerName" type="text" placeholder="例: my_keys, 財布, special_card" autocomplete="off">
    </div>

    <div class="row">
      <button id="startRegButton" class="btn teal wide">📷 登録カメラ起動</button>
      <button id="stopRegButton" class="btn gray wide">⏹ カメラ停止</button>
    </div>
    <div class="camera-container">
      <video id="regVideo" autoplay muted playsinline></video>
      <div class="guide"></div>
    </div>
    <p class="hint">⚠ 物体を黄色い枠に収め、角度や距離を変えて何回も撮影してください</p>

    <div class="row">
      <button id="captureObjectButton" class="btn yellow wide">物体(クラス0)撮影 (<span id="objCount">0</span>)</button>
      <button id="captureBgButton" class="btn gray wide">背景(クラス1)撮影 (<span id="bgCount">0</span>)</button>
    </div>
    <div class="note">背景は「物体を置いていない」場所を撮ります。探したい場所を色々な向きで撮るほど、まちがいが減ります。</div>

    <div class="two-col">
      <div><div class="small-title">物体画像一覧</div><div id="objThumbnails" class="thumbs"></div></div>
      <div><div class="small-title">背景画像一覧</div><div id="bgThumbnails" class="thumbs"></div></div>
    </div>

    <div style="margin-top:14px">
      <button id="trainButton" class="btn green full">⚡ AIに学習させて登録</button>
    </div>
    <div style="margin-top:8px">
      <button id="clearCustomButton" class="btn red full">🗑 登録した物体・モデルを全て消去</button>
    </div>
    <div id="regStatus" class="status-box">ステータス: 「登録カメラ起動」を押してください</div>

    <h3 style="margin-top:18px">📦 登録済みカスタム物体</h3>
    <div id="registeredList"></div>
  </section>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
